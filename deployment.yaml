apiVersion: apps/v1

kind: Deployment

metadata:
  name: petclinic

spec:
  replicas: 2

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
        - name: petclinic
          image: sayyaddevops33/spring-petclinic:17
          ports:
            - containerPort: 8080
